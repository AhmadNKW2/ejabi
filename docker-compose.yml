services:
  postgres:
    image: postgres:16-alpine
    container_name: ejabi-postgres
    environment:
      POSTGRES_USER: ejabi
      POSTGRES_PASSWORD: ejabi
      POSTGRES_DB: ejabi
    ports:
      - "5433:5432"
    volumes:
      - ejabi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ejabi -d ejabi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ejabi_pg:
